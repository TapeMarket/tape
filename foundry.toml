[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./test/fixtures" },
    # The bytecode the scripts deploy, and the sources it is checked against (script/Deployable.sol).
    { access = "read", path = "./deployable" },
    { access = "read", path = "./src" },
    { access = "read", path = "./lib" },
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

[profile.fast]
optimizer_runs = 1
optimizer_details = { yulDetails = { optimizerSteps = "dhfoDgvulfnTUtnIf[xa[r]EscLMcCTUtTOntnfDIulLculVcul[j]Tpeulxa[rul]xa[r]cLgvifCTUca[r]LSsTFOtfDnca[r]Iulc]jmul[jul]VcTOculjmul:fDnTOcmu" } }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
